<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capy Lab Uploader - Authorization</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 680px; margin: 48px auto; padding: 0 16px; line-height: 1.6; color: #2b2622; background: #fbf5e9; }
  h1 { font-size: 28px; }
  code, textarea { font-family: ui-monospace, monospace; }
  textarea { width: 100%; height: 90px; padding: 8px; box-sizing: border-box; }
  button { padding: 8px 16px; font-size: 16px; cursor: pointer; }
  a { color: #b3532f; }
</style>
</head>
<body>
<h1>Authorization complete</h1>
<p id="msg">Reading the result...</p>
<textarea id="code" readonly style="display:none"></textarea>
<p><button id="copy" style="display:none">Copy code</button></p>
<p>Copy this code into the Capy Lab Uploader tool on your computer. The code stays in your browser: this page does not send it anywhere.</p>
<p><a href="index.html">Back to home</a> | <a href="privacy.html">Privacy Policy</a> | <a href="terms.html">Terms of Service</a></p>
<script>
  var p = new URLSearchParams(location.search);
  var code = p.get('code'), err = p.get('error_description') || p.get('error');
  var msg = document.getElementById('msg'), box = document.getElementById('code'), btn = document.getElementById('copy');
  if (code) {
    msg.textContent = 'Authorization code:';
    box.value = code; box.style.display = 'block'; btn.style.display = 'inline-block';
    btn.onclick = function () { box.select(); document.execCommand('copy'); btn.textContent = 'Copied'; };
  } else if (err) {
    msg.textContent = 'Authorization failed: ' + err;
  } else {
    msg.textContent = 'No authorization code in the address. Start from the Capy Lab Uploader tool.';
  }
</script>
</body>
</html>
